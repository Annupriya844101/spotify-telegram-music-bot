<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>My Music Library</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#101114;color:#f6f6f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#25232c,#101114 55%);min-height:100vh}header{padding:28px 18px 18px;max-width:900px;margin:auto}h1{margin:0;font-size:clamp(28px,6vw,44px)}p{color:#b5b5be}main{max-width:900px;margin:auto;padding:0 18px 190px}.search{display:flex;gap:8px;margin:18px 0}input{flex:1;min-width:0;padding:14px;border:1px solid #3a3a44;background:#191a20;color:white;border-radius:12px;font-size:16px}button,.download{background:#d7ff57;color:#171810;border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid white;outline-offset:2px}.track{display:flex;align-items:center;gap:13px;padding:13px;margin:8px 0;background:#1a1b21;border:1px solid #2d2e36;border-radius:15px}.art{width:48px;height:48px;border-radius:10px;background:#30313b;display:grid;place-items:center;font-size:22px;flex-shrink:0}.info{min-width:0;flex:1}.title{font-weight:700;overflow-wrap:anywhere}.artist{font-size:13px;color:#aaaab4;margin-top:3px}.play{border-radius:50%;width:42px;height:42px;padding:0}.download{padding:10px;font-size:13px}footer{position:fixed;bottom:0;left:0;right:0;background:#17181df2;backdrop-filter:blur(16px);border-top:1px solid #33343d;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.player{max-width:900px;margin:auto;display:grid;grid-template-columns:1fr;gap:8px}.now{font-size:13px;color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}audio{width:100%;height:34px}.controls{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.controls button{min-width:44px;padding:9px 12px}.toggle{background:#30313b;color:#f6f6f7}.toggle[aria-pressed="true"]{background:#d7ff57;color:#171810}.small{font-size:12px;color:#9696a2}
</style></head><body>
<header><h1>♫ My Music Library</h1><p>Your licensed tracks, stored in a private Telegram group.</p></header><main>
<div class="search"><input id="q" placeholder="Search songs or artists…" autocomplete="off" aria-label="Search songs or artists"><button id="search">Search</button></div><div id="status" class="small" role="status" aria-live="polite">Loading tracks…</div><div id="tracks"></div><p class="small">Only upload music you own or are licensed to distribute. Spotify protected audio is not downloaded by this service.</p></main>
<footer><div class="player"><div><div class="now" id="now">Choose a track to play</div><audio id="audio" controls preload="none"></audio></div><div class="controls"><button id="prev" class="toggle" aria-label="Previous track">|◀</button><button id="shuffle" class="toggle" aria-pressed="false">🔀 Shuffle</button><button id="repeat" class="toggle" aria-pressed="false">🔁 Repeat: Off</button><button id="next" class="toggle" aria-label="Next track">▶|</button><button id="stop">Stop</button></div></div></footer>
<script>
const list=document.querySelector('#tracks'),statusEl=document.querySelector('#status'),audio=document.querySelector('#audio'),now=document.querySelector('#now');let tracks=[],currentIndex=-1,shuffleOn=false,repeatMode='off';
async function load(){statusEl.textContent='Loading…';try{const q=document.querySelector('#q').value.trim(),r=await fetch('/api/tracks?q='+encodeURIComponent(q));if(!r.ok)throw Error('Request failed');tracks=await r.json();list.replaceChildren();statusEl.textContent=tracks.length?(tracks.length+' track(s)'):'No tracks yet. Send licensed audio to your Telegram bot to add music.';for(let i=0;i<tracks.length;i++){const t=tracks[i],card=document.createElement('div');card.className='track';const art=document.createElement('div');art.className='art';art.textContent='♫';const info=document.createElement('div');info.className='info';const title=document.createElement('div');title.className='title';title.textContent=t.title;const artist=document.createElement('div');artist.className='artist';artist.textContent=t.artist||'Unknown artist';info.append(title,artist);const play=document.createElement('button');play.className='play';play.textContent='▶';play.setAttribute('aria-label','Play '+t.title);play.onclick=()=>playTrack(i);const dl=document.createElement('a');dl.className='download';dl.textContent='↓';dl.title='Download licensed track';dl.setAttribute('aria-label','Download '+t.title);dl.href='/api/download/'+t.id;card.append(art,info,play,dl);list.append(card)}if(currentIndex>=tracks.length)currentIndex=-1}catch(e){statusEl.textContent='Could not load tracks. Check server configuration and logs.'}}
function playTrack(index){if(index<0||index>=tracks.length)return;currentIndex=index;const t=tracks[index];audio.src='/api/stream/'+t.id;now.textContent=t.title+(t.artist?' — '+t.artist:'');audio.play().catch(()=>{statusEl.textContent='Tap play on the audio controls to start playback.'})}
function nextTrack(){if(!tracks.length)return;if(repeatMode==='one'&&currentIndex>=0){audio.currentTime=0;audio.play().catch(()=>{});return}if(shuffleOn&&tracks.length>1){let n=currentIndex;while(n===currentIndex)n=Math.floor(Math.random()*tracks.length);playTrack(n);return}if(currentIndex<tracks.length-1){playTrack(currentIndex+1);return}if(repeatMode==='all')playTrack(0);else{audio.pause();audio.currentTime=0;now.textContent='Playlist finished'}}
function previousTrack(){if(!tracks.length)return;if(audio.currentTime>3){audio.currentTime=0;return}if(shuffleOn&&tracks.length>1){nextTrack();return}if(currentIndex>0)playTrack(currentIndex-1);else if(repeatMode==='all')playTrack(tracks.length-1);else audio.currentTime=0}
document.querySelector('#search').onclick=load;document.querySelector('#q').addEventListener('keydown',e=>{if(e.key==='Enter')load()});document.querySelector('#shuffle').onclick=()=>{shuffleOn=!shuffleOn;const b=document.querySelector('#shuffle');b.setAttribute('aria-pressed',String(shuffleOn));b.textContent=shuffleOn?'🔀 Shuffle: On':'🔀 Shuffle'};document.querySelector('#repeat').onclick=()=>{repeatMode=repeatMode==='off'?'all':repeatMode==='all'?'one':'off';const b=document.querySelector('#repeat');b.setAttribute('aria-pressed',String(repeatMode!=='off'));b.textContent='🔁 Repeat: '+(repeatMode==='all'?'All':repeatMode==='one'?'One':'Off')};document.querySelector('#prev').onclick=previousTrack;document.querySelector('#next').onclick=nextTrack;audio.addEventListener('ended',nextTrack);document.querySelector('#stop').onclick=()=>{audio.pause();audio.removeAttribute('src');audio.load();now.textContent='Playback stopped'};load();
</script></body></html>
